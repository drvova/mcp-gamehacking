name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The declared floor is exercised deliberately. The build tool requires
    # Node >= 20 and the runtime floor is the SDK's, so 20 is the honest minimum;
    # a source or harness file reaching for something newer than package.json
    # promises passes on a modern local Node and fails here, which is the only
    # place that claim is checked.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      # The skill archive is 19 GB, so a full checkout does not fit on a runner.
      # This fetches only what the build and the portable gates need; the
      # archive-dependent checks detect its absence and skip with a loud notice
      # rather than asserting against nothing.
      - name: Checkout (excluding the skill archive)
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/skills/
          sparse-checkout-cone-mode: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint, typecheck and format
        run: npm run check

      - name: Test suite
        run: npm test

      - name: Gate battery
        run: npm run test:gates
